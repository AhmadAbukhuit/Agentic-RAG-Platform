version: 2
updates:
  # Maintain Python pip dependencies in requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      langchain-ecosystem:
        patterns:
          - "langchain*"
          - "langgraph*"
          - "langsmith*"
          - "langserve*"
      database-drivers:
        patterns:
          - "qdrant-client"
          - "fastembed"
          - "redis"
          - "pymongo"
          - "pymupdf"
      web-framework:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic*"

  # Maintain Dockerfile base images (python:3.12-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "docker"
      - "dependencies"

  # Maintain GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "ci/cd"
      - "github-actions"
