name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  ruff-lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Ruff Code Formatting
        run: ruff format --check .

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/.git/**
            !**/node_modules/**

  pytest-suite:
    name: Pytest & Unit Tests
    needs: [ruff-lint]
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          SERVICE_NAME: test-agent-service
          ENABLE_REDIS_CACHE: "true"
        run: |
          pytest tests/test_pipeline.py -v

      - name: Run Local Evaluation Benchmark
        run: |
          python tests/run_evaluation.py --local

  manage-issue:
    name: Manage Failure Issue
    needs: [ruff-lint, markdown-lint, pytest-suite]
    if: >-
      always() &&
      needs.ruff-lint.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Process Issue on Failure or Resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUFF_RESULT: ${{ needs.ruff-lint.result }}
          MD_RESULT: ${{ needs.markdown-lint.result }}
          TESTS_RESULT: ${{ needs.pytest-suite.result }}
          WORKFLOW_NAME: "CI Pipeline"
          ISSUE_TITLE: "🚨 [Automated] CI Pipeline Failure"
          ISSUE_LABEL: "ci-failure"
        run: |
          # Ensure label exists in repository
          gh label create "$ISSUE_LABEL" --color "d73a4a" --description "Automated issue tracking CI pipeline failures" --force 2>/dev/null || true

          # Determine overall workflow success or failure
          if [ "$RUFF_RESULT" = "failure" ] || [ "$MD_RESULT" = "failure" ] || [ "$TESTS_RESULT" = "failure" ] || \
             [ "$RUFF_RESULT" = "cancelled" ] || [ "$MD_RESULT" = "cancelled" ] || [ "$TESTS_RESULT" = "cancelled" ]; then
              STATUS="failure"
          else
              STATUS="success"
          fi

          # Search for existing open issue with this title
          EXISTING_ISSUE=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')

          echo "Workflow Status: $STATUS"
          echo "Existing Open Issue: ${EXISTING_ISSUE:-None}"

          if [ "$STATUS" = "failure" ]; then
              if [ -n "$EXISTING_ISSUE" ]; then
                  echo "An open issue (#$EXISTING_ISSUE) is already open for this failure. Ignoring duplicate and leaving the issue unchanged."
                  exit 0
              fi

              echo "Creating new issue for CI failure..."
              BODY=$(cat <<EOF
          ### 🚨 Automated CI Pipeline Failure

          The **$WORKFLOW_NAME** workflow has failed on:
          - **Branch / Ref**: \`${GITHUB_REF_NAME:-${GITHUB_REF}}\`
          - **Commit**: \`${GITHUB_SHA}\` (\`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\`)
          - **Triggered By**: @${GITHUB_ACTOR}
          - **Workflow Run**: [View Logs & Diagnostics](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          #### Jobs Breakdown:
          - **Ruff Lint & Format**: \`${RUFF_RESULT}\`
          - **Markdown Lint**: \`${MD_RESULT}\`
          - **Pytest Suite**: \`${TESTS_RESULT}\`

          ---
          *This issue was automatically created by GitHub Actions. It will be closed automatically when the CI pipeline passes on a future commit.*
          EOF
              )

              gh issue create \
                --title "$ISSUE_TITLE" \
                --label "$ISSUE_LABEL" \
                --body "$BODY"

          elif [ "$STATUS" = "success" ]; then
              if [ -n "$EXISTING_ISSUE" ]; then
                  echo "CI pipeline succeeded and existing issue #$EXISTING_ISSUE is open. Closing issue..."
                  gh issue close "$EXISTING_ISSUE" \
                    --comment "✅ The **$WORKFLOW_NAME** workflow succeeded on commit \`${GITHUB_SHA}\` (Run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). All checks passed. Resolving and closing this issue."
              else
                  echo "CI pipeline succeeded and no open issue found. Nothing to do."
              fi
          fi
