name: Security Scans & Vulnerability Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  bandit-scan:
    name: Bandit AST Code Security
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r app/ -c pyproject.toml -v

  dependency-audit:
    name: Pip-Audit CVE Scanning
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan requirements.txt for Known CVEs
        run: |
          pip-audit -r requirements.txt --desc on

  secret-detection:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, 'dependabot') &&
      !contains(github.event.head_commit.author.name, 'dependabot') &&
      github.event.head_commit.author.username != 'dependabot[bot]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  manage-issue:
    name: Manage Security Issue
    needs: [bandit-scan, dependency-audit, secret-detection]
    if: >-
      always() &&
      needs.bandit-scan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Process Issue on Failure or Resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BANDIT_RESULT: ${{ needs.bandit-scan.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SECRET_RESULT: ${{ needs.secret-detection.result }}
          WORKFLOW_NAME: "Security Scans & Vulnerability Testing"
          ISSUE_TITLE: "🚨 [Automated] Security Scans & Vulnerability Failure"
          ISSUE_LABEL: "security-failure"
        run: |
          # Ensure label exists in repository
          gh label create "$ISSUE_LABEL" --color "b60205" --description "Automated issue tracking security scan failures" --force 2>/dev/null || true

          # Determine overall workflow success or failure
          if [ "$BANDIT_RESULT" = "failure" ] || [ "$AUDIT_RESULT" = "failure" ] || [ "$SECRET_RESULT" = "failure" ] || \
             [ "$BANDIT_RESULT" = "cancelled" ] || [ "$AUDIT_RESULT" = "cancelled" ] || [ "$SECRET_RESULT" = "cancelled" ]; then
              STATUS="failure"
          else
              STATUS="success"
          fi

          # Search for existing open issue with this title
          EXISTING_ISSUE=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number')

          echo "Security Workflow Status: $STATUS"
          echo "Existing Open Issue: ${EXISTING_ISSUE:-None}"

          if [ "$STATUS" = "failure" ]; then
              if [ -n "$EXISTING_ISSUE" ]; then
                  echo "An open issue (#$EXISTING_ISSUE) is already open for this security failure. Ignoring duplicate and leaving the issue unchanged."
                  exit 0
              fi

              echo "Creating new issue for Security failure..."
              BODY=$(cat <<EOF
          ### 🚨 Automated Security Scan Failure

          The **$WORKFLOW_NAME** workflow has detected issues or failed on:
          - **Branch / Ref**: \`${GITHUB_REF_NAME:-${GITHUB_REF}}\`
          - **Commit**: \`${GITHUB_SHA}\` (\`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\`)
          - **Triggered By**: @${GITHUB_ACTOR}
          - **Workflow Run**: [View Logs & Security Diagnostics](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          #### Jobs Breakdown:
          - **Bandit AST Code Security**: \`${BANDIT_RESULT}\`
          - **Pip-Audit CVE Scanning**: \`${AUDIT_RESULT}\`
          - **Secret & Credential Leak Scan**: \`${SECRET_RESULT}\`

          ---
          *This issue was automatically created by GitHub Actions. It will be closed automatically when all security scans pass on a future commit.*
          EOF
              )

              gh issue create \
                --title "$ISSUE_TITLE" \
                --label "$ISSUE_LABEL" \
                --body "$BODY"

          elif [ "$STATUS" = "success" ]; then
              if [ -n "$EXISTING_ISSUE" ]; then
                  echo "Security scans succeeded and existing issue #$EXISTING_ISSUE is open. Closing issue..."
                  gh issue close "$EXISTING_ISSUE" \
                    --comment "✅ The **$WORKFLOW_NAME** workflow passed all scans on commit \`${GITHUB_SHA}\` (Run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Resolving and closing this security issue."
              else
                  echo "Security scans succeeded and no open issue found. Nothing to do."
              fi
          fi
