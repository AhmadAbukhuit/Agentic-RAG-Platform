[project]
name = "agentic-rag-platform"
version = "1.0.0"
description = "Enterprise Agentic RAG Platform with LangGraph, Qdrant, Redis, and LangSmith"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
exclude = [
    ".git",
    "__pycache__",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "state", "prompts", "nodes", "tools", "graphs"]

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]  # asserts in test suites

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["app", "tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
